<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Sign-up form</title>

</head>
<body>
    <div class="ancestor-container">
        <div class="image-side"></div>
        <div class="web-container">
            <section class="head-container">
                <h3>this is nor a real online service! You know you need something like this in your life
                    to help you realize your deepest dreams. Sign up <em>now</em> to get started
                </h3>
                <h3>you know what to do.</h3>
            </section>
            <section class="form-container">
                <h3>Lets do this!</h3>
                <form>
                    <div class="label-input">
                        <label for="name">FIRST NAME</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <div class="label-input">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>
                    <div class="label-input">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="label-input">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" name="phone" id="phone">
                    </div>
                    <div class="label-input">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password">
                    </div>
                    <div class="label-input">
                        <label for="password">CONFIRM PASSWORD</label>
                        <input type="password" name="password" id="password">
                    </div>

                </form>
            </section>
            <section class="footer">
                <button>Create Account</button>
                <p>Already have an account?<a href="https://google.com" class="link-color">Sign up</a></p>
            </section>

        </div>
    </div>

</body>
</html>
